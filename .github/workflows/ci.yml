name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.14"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -U pip build && python -m pip install -e ".[test]"
      - name: Compile
        run: >-
          python -m compileall -q
          bulk_label_editor_plugin extract_pins_plugin fanout_generator_plugin
          harness_workbench_plugin heater_designer_plugin kilo_plugin
          manufacturing_readiness_plugin pdn_decoupling_plugin
          planar_magnetics_plugin portable_assets_plugin
          protocol_constraint_composer_plugin return_path_auditor_plugin
          signal_integrity_advisor_plugin test_point_descriptor_plugin
          trace_impedance_plugin variant_workbench_plugin via_stitching_plugin
          bom_studio_plugin embed_3d_plugin wayricad_runtime tools tests
      - name: Unit and integration tests
        run: python -m pytest tests -q -s
      - name: Embed3D regressions
        run: python -m unittest discover -s embed_3d_plugin/tests -v
      - name: BOM Studio regressions
        working-directory: bom_studio_plugin
        run: python -m unittest discover -s tests -v
      - name: CLI smoke
        run: |
          wayricad --help
          wayricad inspect tests/fixtures/simple_hierarchy.xml --board-sequence DEMO_CTRL,DEMO_SENSOR --format json
          wayricad benchmark --nets 500 --boards 3 --threshold-ms 3000 --format json
      - name: Package validation
        run: |
          python -m build
          python build_pcm.py --clean-feed
          python tools/validate_packages.py
