name: CI

on:
  push:
    branches: [develop, main, "release-*"]
  pull_request:
    branches: [develop, main]

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.14"]
        include:
          # Avoid the ARM64 hosted-runner capacity pool; retain macOS tests.
          - os: macos-15-intel
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -U pip build && python -m pip install -e ".[test]"
      - name: Compile
        run: >-
          python -m compileall -q
          bulk_label_editor_plugin extract_pins_plugin fanout_generator_plugin
          harness_workbench_plugin heater_designer_plugin
          manufacturing_readiness_plugin planar_magnetics_plugin
          protocol_constraint_composer_plugin signal_integrity_advisor_plugin
          trace_impedance_plugin via_stitching_plugin
          bom_studio_plugin embed_3d_plugin copper_balancer_plugin
          mechanical_check_plugin quick_emerge_plugin quick_pi_plugin quick_therm_plugin project_fusion_plugin variant_manager_plugin suite_assistant_plugin review_comments_plugin wayricad_runtime tools tests
      # Keep the checked-in PCM feed on the published release; test fresh candidate metadata.
      - name: Build candidate PCM feed for tests
        run: python build_pcm.py --clean-feed
      - name: Unit and integration tests
        run: python -m pytest tests -q -s
      - name: Quick PI setup and return regressions
        run: >-
          python -m pytest quick_pi_plugin/tests/test_shared_return_contacts.py
          quick_pi_plugin/tests/test_shared_return.py quick_pi_plugin/tests/test_power_tree.py
          quick_pi_plugin/tests/test_power_tree_cli.py quick_pi_plugin/tests/test_insulation_screen.py
          quick_pi_plugin/tests/test_series_groups.py quick_pi_plugin/tests/test_insulation_cli.py -q
      - name: Quick EMerge beta regressions
        run: python -m pytest quick_emerge_plugin/tests -q
      - name: Embed3D regressions
        run: python -m unittest discover -s embed_3d_plugin/tests -v
      - name: BOM Studio regressions
        working-directory: bom_studio_plugin
        run: python -m unittest discover -s tests -v
      - name: Fusion regressions
        if: runner.os != 'macOS'
        run: python -m unittest discover -s project_fusion_plugin/tests -v
      - name: Fusion portable protocol contracts on unsupported macOS
        if: runner.os == 'macOS'
        run: python -m unittest discover -s project_fusion_plugin/tests -p test_live_apply.py -v
      - name: Variant Manager regressions
        run: python -m unittest discover -s variant_manager_plugin/tests -v
      - name: CLI smoke
        run: |
          wayricad --help
          wayricad-jobs --help
          wayricad jobs presets
          wayricad inspect tests/fixtures/simple_hierarchy.xml --board-sequence DEMO_CTRL,DEMO_SENSOR --format json
          wayricad benchmark --nets 500 --boards 3 --threshold-ms 3000 --format json
          wayricad-copper --help
          wayricad-mechanical --help
          wayricad-trace-refiner --help
          wayricad-rlc --help
          wayricad-library --help
          wayricad-pi --help
          wayricad-therm --help
          wayricad-si --help
          wayricad-assistant capabilities
          wayricad-review --help
          wayricad-pocket-export --help
          wayricad-results --help
          python -m unittest discover -s suite_assistant_plugin/tests -v
          python -m unittest discover -s quick_pi_plugin/tests -p test_console.py -v
          python -m unittest discover -s quick_pi_plugin/tests -p test_service_guards.py -v
          python -m unittest discover -s quick_pi_plugin/tests -p test_convergence.py -v
          python -m pytest extract_pins_plugin/tests -q
          python -m pytest review_comments_plugin/tests -q
          python -m pytest signal_integrity_advisor_plugin/tests/test_saved_results.py -q
          python -m pytest signal_integrity_advisor_plugin/tests/test_setup_state.py -q
          python -m pytest mechanical_check_plugin/tests/test_pocket_results.py -q
          python -m unittest discover -s signal_integrity_advisor_plugin/tests -p test_quick_si.py -v
          python -m unittest discover -s signal_integrity_advisor_plugin/tests -p test_pair_timing.py -v
          python -m pytest signal_integrity_advisor_plugin/tests/test_ibis_models.py signal_integrity_advisor_plugin/tests/test_ibis_workflow.py signal_integrity_advisor_plugin/tests/test_ibis_ui.py signal_integrity_advisor_plugin/tests/test_circuit_scope.py -q
          python -m unittest discover -s signal_integrity_advisor_plugin/tests -p test_testpoint_labels.py -v
          python -m unittest discover -s signal_integrity_advisor_plugin/tests -p "test_eye*.py" -v
          python -m unittest discover -s manufacturing_readiness_plugin/tests -v
      - name: Development-folder plugin regressions
        run: |
          python -m unittest discover -s bulk_label_editor_plugin/tests -v
          python -m unittest discover -s copper_balancer_plugin/tests -v
          python -m unittest discover -s mechanical_check_plugin/tests -v
          python -m unittest discover -s silkscreen_label_plugin/tests -v
          python -m unittest discover -s layer_counter_plugin/tests -v
          python -m unittest discover -s trace_refiner_plugin/tests -v
          python -m unittest discover -s component_arranger_plugin/tests -v
          python -m pytest protocol_constraint_composer_plugin/tests -q
      - name: Portable PI and magnetics physics regressions
        run: |
          python -m unittest discover -s heater_designer_plugin/tests -v
          python -m pip install "numpy>=1.24,<3" "scipy>=1.10,<2" "matplotlib>=3.7,<4"
          python -m pytest quick_therm_plugin/tests -q
          python -m pytest quick_pi_plugin/tests -q --ignore=quick_pi_plugin/tests/test_mesh.py
          python -m unittest discover -s planar_magnetics_plugin/tests -v
      - name: Package validation
        run: |
          python -m build
          python build_pcm.py --clean-feed
          python tools/validate_packages.py
          python tools/validate_docs.py
          python tools/smoke_imported_packages.py

  pi-reference:
    name: PI known-answer benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install scientific runtime
        run: python -m pip install "numpy>=1.24,<3" "scipy>=1.10,<2" "matplotlib>=3.7,<4" "vtk>=9.3,<10"
      - name: Verify production mesher and solver
        run: |
          python -m unittest discover -s quick_pi_plugin/tests -p test_mesh.py -v
          python -m unittest discover -s quick_pi_plugin/tests -p test_verification.py -v
          python -m quick_pi_plugin.verification --output pi-reference-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pi-reference-results
          path: pi-reference-results.json
