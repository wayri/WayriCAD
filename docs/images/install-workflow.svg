<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="390" viewBox="0 0 1280 390" role="img" aria-labelledby="title desc">
<title id="title">Install WayriCAD in KiCad 10</title><desc id="desc">Open Plugin and Content Manager, choose the WayriCAD repository or a PCM ZIP, install and apply changes, then enable the API and launch from your saved board.</desc>
<rect width="1280" height="390" rx="20" fill="#f4f7fb"/>
<g font-family="Segoe UI,Arial,sans-serif" fill="#172b46"><text x="32" y="47" font-size="27" font-weight="700">Install → prepare → open your board</text><text x="32" y="76" font-size="16" fill="#52657a">KiCad 10 • Illustrated click-path • Full instructions linked below</text>
<rect x="32" y="109" width="286" height="222" rx="12" fill="white" stroke="#ced9e5"/><circle cx="62" cy="140" r="17" fill="#176c9f"/><text x="62" y="146" text-anchor="middle" fill="white" font-size="17" font-weight="700">1</text><text x="89" y="146" font-size="19" font-weight="700">Open PCM</text><rect x="48" y="167" width="254" height="100" rx="7" fill="#eaf2fa"/><text x="60" y="199" font-size="16">KiCad Manager</text><text x="60" y="230" font-size="14">Plugin and Content Manager</text><text x="49" y="301" font-size="14" fill="#52657a">Start in the project manager.</text><rect x="342" y="109" width="286" height="222" rx="12" fill="white" stroke="#ced9e5"/><circle cx="372" cy="140" r="17" fill="#176c9f"/><text x="372" y="146" text-anchor="middle" fill="white" font-size="17" font-weight="700">2</text><text x="399" y="146" font-size="19" font-weight="700">Choose a source</text><rect x="358" y="167" width="254" height="100" rx="7" fill="#eaf2fa"/><text x="370" y="199" font-size="16">WayriCAD repository</text><text x="370" y="230" font-size="14">or Install from File → PCM ZIP</text><text x="359" y="301" font-size="14" fill="#52657a">Keep the PCM ZIP intact.</text><rect x="652" y="109" width="286" height="222" rx="12" fill="white" stroke="#ced9e5"/><circle cx="682" cy="140" r="17" fill="#176c9f"/><text x="682" y="146" text-anchor="middle" fill="white" font-size="17" font-weight="700">3</text><text x="709" y="146" font-size="19" font-weight="700">Install your tools</text><rect x="668" y="167" width="254" height="100" rx="7" fill="#eaf2fa"/><text x="680" y="199" font-size="16">Install → Apply changes</text><text x="680" y="230" font-size="14">Enable API in Preferences</text><text x="669" y="301" font-size="14" fill="#52657a">Allow Python setup to finish.</text><rect x="962" y="109" width="286" height="222" rx="12" fill="white" stroke="#ced9e5"/><circle cx="992" cy="140" r="17" fill="#176c9f"/><text x="992" y="146" text-anchor="middle" fill="white" font-size="17" font-weight="700">4</text><text x="1019" y="146" font-size="19" font-weight="700">Launch from your board</text><rect x="978" y="167" width="254" height="100" rx="7" fill="#eaf2fa"/><text x="990" y="199" font-size="16">Restart PCB Editor</text><text x="990" y="230" font-size="14">Open + save → WayriCAD tool</text><text x="979" y="301" font-size="14" fill="#52657a">Begin with Preview or Inspect.</text><text x="32" y="365" font-size="16" fill="#52657a">First setup may need internet. PCM installation and optional terminal/CLI installation are separate.</text></g></svg>