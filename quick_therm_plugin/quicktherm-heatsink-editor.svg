<svg xmlns="http://www.w3.org/2000/svg" width="920" height="650" viewBox="0 0 920 650" role="img" aria-labelledby="title desc">
<title id="title">Virtual heatsink editor, illustrated layout</title>
<desc id="desc">Illustration based on the current native wxPython virtual heatsink editor, showing component choice, shape, editable dimensions, contact and environment thermal resistances, and a top-view fin preview. Values are synthetic examples.</desc>
<style>text{font-family:Segoe UI,Arial,sans-serif;fill:#e8eef1;font-size:14px}.small{font-size:12px;fill:#abb9c0}.label{font-size:13px;fill:#c4d0d5}.title{font-size:18px;font-weight:700}.field{fill:#292d32;stroke:#687681}.button{fill:#345867;stroke:#7191a0}.outline{fill:#252a2f;stroke:#53636d}</style>
<rect width="920" height="650" fill="#1d2024"/><rect width="920" height="34" fill="#15191d"/><text x="14" y="22" class="small">QuickTherm · Virtual heatsinks</text>
<text x="20" y="64" class="title">Assign a virtual heatsink to a component</text>
<text x="20" y="88" class="small">Editable envelopes illustrate shape only. Enter actual resistance for the intended air or vacuum path.</text>
<rect x="20" y="111" width="240" height="468" rx="5" class="outline"/><text x="34" y="140" class="label">Assigned components</text>
<rect x="34" y="155" width="211" height="356" rx="3" class="field"/><rect x="37" y="159" width="205" height="30" fill="#285766"/><text x="48" y="180">U1 · Straight fins</text>
<rect x="34" y="526" width="176" height="34" rx="3" class="button"/><text x="49" y="548">Remove assignment</text>
<g class="label"><text x="281" y="138">Component</text><text x="281" y="179">Shape</text><text x="281" y="220">Width mm</text><text x="281" y="261">Depth mm</text><text x="281" y="302">Height mm</text><text x="281" y="343">Contact Rθ K/W</text><text x="281" y="384">Air sink-to-ambient Rθ K/W</text><text x="281" y="425">Vacuum sink-to-environment Rθ K/W</text></g>
<g class="field"><rect x="550" y="117" width="344" height="30" rx="3"/><rect x="550" y="158" width="344" height="30" rx="3"/><rect x="550" y="199" width="344" height="30" rx="3"/><rect x="550" y="240" width="344" height="30" rx="3"/><rect x="550" y="281" width="344" height="30" rx="3"/><rect x="550" y="322" width="344" height="30" rx="3"/><rect x="550" y="363" width="344" height="30" rx="3"/><rect x="550" y="404" width="344" height="30" rx="3"/></g>
<text x="563" y="138">U1  ▾</text><text x="563" y="179">Straight fins  ▾</text><text x="563" y="220">40</text><text x="563" y="261">40</text><text x="563" y="302">15</text><text x="563" y="343">0.2</text><text x="563" y="384">8</text><text x="563" y="425" class="small">Enter vacuum-specific value if used</text>
<rect x="281" y="450" width="613" height="112" fill="#eef3f2" rx="3"/><text x="299" y="470" style="fill:#2c5c66;font-size:12px">Top view · Straight fins · editable envelope</text>
<rect x="476" y="482" width="230" height="60" fill="#cbdde0" stroke="#347185" stroke-width="2"/>
<g stroke="#147b90" stroke-width="7"><line x1="504" y1="488" x2="504" y2="536"/><line x1="539" y1="488" x2="539" y2="536"/><line x1="574" y1="488" x2="574" y2="536"/><line x1="609" y1="488" x2="609" y2="536"/><line x1="644" y1="488" x2="644" y2="536"/><line x1="679" y1="488" x2="679" y2="536"/></g>
<text x="283" y="585" class="small">Only entered Rθ values affect calculated temperatures.</text>
<rect x="693" y="572" width="200" height="34" rx="3" class="button"/><text x="709" y="594">Assign / update heatsink</text>
<rect x="740" y="612" width="72" height="27" rx="3" class="button"/><rect x="821" y="612" width="72" height="27" rx="3" class="field"/><text x="763" y="630">OK</text><text x="834" y="630">Cancel</text>
<text x="20" y="630" class="small">ILLUSTRATION · Synthetic values; no product thermal rating is inferred from geometry</text>
</svg>
