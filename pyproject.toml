[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wayricad"
version = "3.2.0"
description = "WayriCAD: KiCad plugins and CLI tools for PCB design, routing, electrical analysis, BOMs and portable libraries"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
authors = [{name = "Wayri (Yawar)"}]
dependencies = ["networkx>=2.8"]
keywords = ["wayricad", "kiway", "kicad", "kicad-plugins", "pcb-design", "eda", "routing", "signal-integrity", "power-integrity", "bom", "icd", "cli", "aerospace", "harness"]

[project.urls]
Homepage = "https://github.com/wayri/WayriCAD"
Documentation = "https://github.com/wayri/WayriCAD/blob/develop/docs/USER_GUIDE.md"
Repository = "https://github.com/wayri/WayriCAD"
Issues = "https://github.com/wayri/WayriCAD/issues"
Changelog = "https://github.com/wayri/WayriCAD/releases"

[project.optional-dependencies]
test = ["Pillow>=9.0", "pytest>=8", "jsonschema>=4", "kicad-python>=0.8.0,<0.9", "zstandard>=0.25.0,<1"]

[project.scripts]
wayricad = "extract_pins_plugin.cli:main"
wayricad-route = "wayricad_runtime.cli:main"
wayricad-rlc = "trace_impedance_plugin.cli:main"
wayricad-mechanical = "mechanical_check_plugin.cli:main"
wayricad-copper = "copper_balancer_plugin.cli:main"
wayricad-library = "embed_3d_plugin.__main__:main"
wayricad-pi = "quick_pi_plugin.cli:main"
wayricad-si = "signal_integrity_advisor_plugin.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["*_plugin", "*_plugin.*", "wayricad_runtime"]
exclude = ["kilo_plugin", "kilo_plugin.*", "portable_assets_plugin", "portable_assets_plugin.*", "build*", "dist*", "tests*", "tools*", ".validation*", "*.tests", "*.tests.*", "visual_diff_plugin", "visual_diff_plugin.*", "pdn_decoupling_plugin", "pdn_decoupling_plugin.*", "return_path_auditor_plugin", "return_path_auditor_plugin.*", "test_point_descriptor_plugin", "test_point_descriptor_plugin.*", "variant_workbench_plugin", "variant_workbench_plugin.*"]

[tool.setuptools.package-data]
wayricad_runtime = ["*.md"]
"*" = ["LICENSE", "LICENSE.*", "SOURCE_PROVENANCE.json"]
extract_pins_plugin = ["*.html", "*.md", "*.txt", "*.svg", "*.png", "metadata.json"]
harness_workbench_plugin = ["*.html", "*.md", "*.png", "metadata.json"]
fanout_generator_plugin = ["*.html", "*.md", "*.json", "*.png", "resources/*.png"]
trace_impedance_plugin = ["*.html", "*.md", "*.json", "*.png", "resources/*.png"]
"signal_integrity_advisor_plugin.return_path" = ["*.html", "*.md", "*.png"]
"signal_integrity_advisor_plugin.test_points" = ["*.html", "*.md", "*.png"]
"quick_pi_plugin.decoupling" = ["*.html", "*.md", "*.png"]
signal_integrity_advisor_plugin = ["*.html", "*.md", "*.json", "*.png", "resources/*.png"]
mechanical_check_plugin = ["*.html", "*.md", "*.json", "*.png", "resources/*.png", "resources/*.html", "src/wayricad_mechanical/*.py", "src/wayricad_mechanical/*.html", "src/wayricad_mechanical/*.js"]
copper_balancer_plugin = ["*.html", "*.md", "*.json", "*.png", "resources/*.png"]
quick_pi_plugin = ["*.html", "*.md", "*.json", "*.png", "resources/*.png"]
embed_3d_plugin = ["*.html", "*.md", "*.json", "*.png", "resources/*.png"]
protocol_constraint_composer_plugin = ["*.html", "*.md", "*.json", "*.png", "resources/*.png", "docs/*.md", "examples/*", "examples/profiles/*.json", "examples/workflow_demo/*", "web/*.html", "web/*.css", "web/*.js"]
"protocol_constraint_composer_plugin.constraint_studio" = ["*.html", "*.png", "LICENSE*", "help/*.json", "help/images/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
