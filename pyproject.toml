[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kiway"
version = "2.10.0"
description = "KiWay KiCad electrical systems CLI and plugin package"
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-3.0-only"
authors = [{name = "Wayri (Yawar)"}]
dependencies = ["networkx>=2.8"]
keywords = ["kicad", "eda", "icd", "cli", "aerospace", "harness"]

[project.optional-dependencies]
test = ["Pillow>=9.0"]

[project.scripts]
kiway = "extract_pins_plugin.cli:main"

[tool.setuptools]
packages = ["extract_pins_plugin", "extract_pins_plugin.core"]
include-package-data = true

[tool.setuptools.package-data]
extract_pins_plugin = ["*.html", "*.md", "*.txt", "*.svg", "*.png", "metadata.json"]
